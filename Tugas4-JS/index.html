<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Order</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <img src="profile.jpg" alt="Foto Profile" class="pp">
        <div class="header-info">
            <h1>Vito Satria</h1>
            <p>255314145</p>
        </div>
    </header>

    <main class="container">
        <div id="form-awal">
            <label for="nama">Nama :</label><br>
            <input type="text" id="nama" placeholder="Masukkan nama"><br><br>

            <label for="jumlah">Jumlah pilihan :</label><br>
            <input type="number" id="jumlah" min="1" placeholder="Masukkan angka"><br><br>

            <button type="button" id="btnOK">OK</button>
        </div>

        <div id="wadah-pilih"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
